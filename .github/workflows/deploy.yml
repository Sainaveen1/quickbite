name: Deploy API to Oracle VM
on:
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/**", "deploy/**", "infra/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    # Free Arm64 runner for public repos, so the image is built natively for the Ampere VM.
    runs-on: ubuntu-24.04-arm
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/quickbite-api:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/quickbite-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-image
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Copy deploy files
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh "$VM_USER@$VM_HOST" "mkdir -p ~/quickbite/infra"
          scp deploy/docker-compose.prod.yml deploy/Caddyfile "$VM_USER@$VM_HOST:~/quickbite/"
          scp -r infra/postgres "$VM_USER@$VM_HOST:~/quickbite/infra/"
      - name: Pull and restart
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh "$VM_USER@$VM_HOST" "cd ~/quickbite && \
            API_TAG=$SHA docker compose -f docker-compose.prod.yml --env-file .env pull api && \
            API_TAG=$SHA docker compose -f docker-compose.prod.yml --env-file .env up -d --build --remove-orphans && \
            docker image prune -f"
      - name: Smoke test
        env:
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$API_DOMAIN/health"; then exit 0; fi
            sleep 6
          done
          echo "Health check failed"; exit 1
